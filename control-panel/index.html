<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Self-Healing Microservice Recovery Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #050d1a;
  color: #e2e8f0;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Animated background canvas ── */
#bg-canvas {
  position: fixed;
  inset: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* Everything above the canvas */
header, .container { position: relative; z-index: 1; }

/* ── HEADER ── */
header {
  text-align: center;
  padding: 48px 24px 36px;
  position: relative;
}

header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 600px; max-width: 90%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(99,102,241,0.4), transparent);
}

.header-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(99,102,241,0.12);
  border: 1px solid rgba(99,102,241,0.25);
  border-radius: 20px;
  padding: 4px 14px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #818cf8;
  margin-bottom: 18px;
}

header h1 {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.5px;
  background: linear-gradient(120deg, #e2e8f0 20%, #818cf8 60%, #38bdf8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
}

header p {
  font-size: 14px;
  color: #475569;
  font-weight: 400;
}

/* ── CONTAINER ── */
.container {
  max-width: 880px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}

/* ── SIDE BY SIDE GRID ── */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

@media (max-width: 600px) {
  .grid-2 { grid-template-columns: 1fr; }
  header h1 { font-size: 24px; }
}

/* ── CARD ── */
.card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 20px;
  padding: 24px;
  margin-bottom: 16px;
  backdrop-filter: blur(20px);
  box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 24px 48px rgba(0,0,0,0.4);
  transition: border-color 0.25s, box-shadow 0.25s;
}

.card:hover {
  border-color: rgba(255,255,255,0.12);
  box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 24px 48px rgba(0,0,0,0.5);
}

.card.no-margin { margin-bottom: 0; }

/* ── CARD HEADER ── */
.card-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #475569;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-title-icon {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.07);
}

/* ── SYSTEM CONTROL ── */
.system-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

/* ── BUTTONS ── */
button {
  padding: 11px 22px;
  border: none;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 0.2px;
  transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
  position: relative;
}

button:hover  { transform: translateY(-1px); }
button:active { transform: translateY(0); opacity: 0.85; }

.start {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: #fff;
  box-shadow: 0 0 0 1px rgba(34,197,94,0.3), 0 4px 20px rgba(34,197,94,0.25);
}
.start:hover { box-shadow: 0 0 0 1px rgba(34,197,94,0.4), 0 8px 28px rgba(34,197,94,0.35); }

.stop {
  background: rgba(239,68,68,0.12);
  color: #f87171;
  box-shadow: 0 0 0 1px rgba(239,68,68,0.2);
}
.stop:hover { background: rgba(239,68,68,0.18); box-shadow: 0 0 0 1px rgba(239,68,68,0.35); }

/* ── STATUS ── */
.status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 500;
  color: #64748b;
  margin-left: auto;
}

.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #334155;
  flex-shrink: 0;
}

.running .dot {
  background: #22c55e;
  box-shadow: 0 0 0 3px rgba(34,197,94,0.2);
  animation: pulse-green 2s infinite;
}

.stopped .dot {
  background: #ef4444;
  box-shadow: 0 0 0 3px rgba(239,68,68,0.2);
}

@keyframes pulse-green {
  0%, 100% { box-shadow: 0 0 0 3px rgba(34,197,94,0.2); }
  50%       { box-shadow: 0 0 0 5px rgba(34,197,94,0.1); }
}

/* ── CONTROL ROW ── */
.control {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.control:last-child { border-bottom: none; padding-bottom: 0; }
.control:first-child { padding-top: 0; }

.control-label {
  font-size: 14px;
  font-weight: 500;
  color: #cbd5e1;
}

/* ── TOGGLE ── */
.toggle {
  position: relative;
  width: 52px;
  height: 28px;
  flex-shrink: 0;
}

.toggle input { display: none; }

.slider {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  cursor: pointer;
  transition: 0.25s;
}

.slider::before {
  content: "";
  position: absolute;
  height: 20px; width: 20px;
  left: 3px; top: 3px;
  background: #64748b;
  border-radius: 50%;
  transition: 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 1px 4px rgba(0,0,0,0.4);
}

input:checked + .slider {
  background: linear-gradient(135deg, #6366f1, #0ea5e9);
  border-color: transparent;
  box-shadow: 0 0 16px rgba(99,102,241,0.4);
}

input:checked + .slider::before {
  transform: translateX(24px);
  background: #fff;
}

</style>
</head>

<body>

<canvas id="bg-canvas"></canvas>

<header>
  <div class="header-badge">⚡ Live System</div>
  <h1>AI Self-Healing Microservice Recovery Platform</h1>
  <p>Monitor and control your autonomous microservice cluster</p>
</header>

<div class="container">

  <!-- System Control -->
  <div class="card">
    <div class="card-title">
      <div class="card-title-icon">🚀</div>
      System Control
    </div>
    <div class="system-row">
      <button id="startBtn" class="start">Start System</button>
      <button id="stopBtn"  class="stop">Stop System</button>
      <div class="status stopped" id="statusWrapper">
        <div class="dot"></div>
        <span id="systemStatus">Checking...</span>
      </div>
    </div>
  </div>

  <!-- Traffic + Latency side by side -->
  <div class="grid-2">

    <div class="card no-margin">
      <div class="card-title">
        <div class="card-title-icon">📡</div>
        Traffic Generation
      </div>
      <div class="control">
        <div class="control-label">Auth Traffic</div>
        <label class="toggle">
          <input type="checkbox" id="authTraffic">
          <span class="slider"></span>
        </label>
      </div>
      <div class="control">
        <div class="control-label">Order Traffic</div>
        <label class="toggle">
          <input type="checkbox" id="orderTraffic">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="card no-margin">
      <div class="card-title">
        <div class="card-title-icon">🔥</div>
        Latency Injection
      </div>
      <div class="control">
        <div class="control-label">Auth Latency</div>
        <label class="toggle">
          <input type="checkbox" id="authLatency">
          <span class="slider"></span>
        </label>
      </div>
      <div class="control">
        <div class="control-label">Order Latency</div>
        <label class="toggle">
          <input type="checkbox" id="orderLatency">
          <span class="slider"></span>
        </label>
      </div>
    </div>

  </div>

</div>


<script>

const CONTROL="http://localhost:7010"
const AUTH="http://localhost:8001"
const ORDER="http://localhost:8002"

const statusText=document.getElementById("systemStatus")
const wrapper=document.getElementById("statusWrapper")

/* STATUS */

async function updateStatus(){
try{
let res=await fetch(`${CONTROL}/system-status`)
let data=await res.json()

if(data.running){
statusText.innerText="Running"
wrapper.classList.add("running")
wrapper.classList.remove("stopped")
}else{
statusText.innerText="Stopped"
wrapper.classList.add("stopped")
wrapper.classList.remove("running")
}

}catch{
statusText.innerText="Unreachable"
}
}

setInterval(updateStatus,2000)
updateStatus()

/* SYSTEM CONTROL */

startBtn.onclick=async()=>{
statusText.innerText="Starting..."
await fetch(`${CONTROL}/start-system`,{method:"POST"})
}

stopBtn.onclick=async()=>{
statusText.innerText="Stopping..."
await fetch(`${CONTROL}/stop-system`,{method:"POST"})
}

/* TRAFFIC */

authTraffic.onchange=e=>{
if(e.target.checked){
fetch(`${CONTROL}/start-auth-traffic`,{method:"POST"})
}else{
fetch(`${CONTROL}/stop-auth-traffic`,{method:"POST"})
}
}

orderTraffic.onchange=e=>{
if(e.target.checked){
fetch(`${CONTROL}/start-order-traffic`,{method:"POST"})
}else{
fetch(`${CONTROL}/stop-order-traffic`,{method:"POST"})
}
}

/* LATENCY */

authLatency.onchange=e=>{
fetch(`${AUTH}/toggle-latency?enabled=${e.target.checked}`,{method:"POST"})
}

orderLatency.onchange=e=>{
fetch(`${ORDER}/toggle-latency?enabled=${e.target.checked}`,{method:"POST"})
}

</script>


<script>
/* ── Aurora + particle network background ── */
(function () {
  const canvas = document.getElementById('bg-canvas');
  const ctx    = canvas.getContext('2d');

  let W, H;
  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', () => { resize(); initParticles(); });

  /* ── Aurora blobs ── */
  const blobs = [
    { x:0.15, y:0.20, r:0.70, hue:258, speed:0.00022, phase:0.0  },
    { x:0.80, y:0.15, r:0.60, hue:200, speed:0.00017, phase:1.8  },
    { x:0.60, y:0.75, r:0.65, hue:280, speed:0.00025, phase:3.5  },
    { x:0.10, y:0.80, r:0.50, hue:220, speed:0.00019, phase:5.1  },
    { x:0.85, y:0.60, r:0.55, hue:185, speed:0.00021, phase:2.7  },
  ];

  /* ── Particles ── */
  const PARTICLE_COUNT = 70;
  const CONNECT_DIST   = 140;
  let particles = [];

  function initParticles() {
    particles = Array.from({ length: PARTICLE_COUNT }, () => ({
      x:  Math.random() * W,
      y:  Math.random() * H,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      r:  Math.random() * 1.5 + 0.5,
    }));
  }
  initParticles();

  function drawBlobs(ts) {
    blobs.forEach(b => {
      const t  = ts * b.speed + b.phase;
      const cx = (b.x + Math.sin(t * 1.1) * 0.18 + Math.cos(t * 0.7) * 0.08) * W;
      const cy = (b.y + Math.cos(t * 0.9) * 0.15 + Math.sin(t * 1.3) * 0.06) * H;
      const rad = b.r * Math.min(W, H);
      const hue = b.hue + Math.sin(t * 0.5) * 20;

      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
      g.addColorStop(0,   `hsla(${hue},90%,60%,0.22)`);
      g.addColorStop(0.4, `hsla(${hue},80%,50%,0.10)`);
      g.addColorStop(0.75,`hsla(${hue},70%,40%,0.04)`);
      g.addColorStop(1,   `hsla(${hue},70%,30%,0)`);

      ctx.beginPath();
      ctx.arc(cx, cy, rad, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
    });
  }

  function drawParticles() {
    /* connections */
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx   = particles[i].x - particles[j].x;
        const dy   = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < CONNECT_DIST) {
          const alpha = (1 - dist / CONNECT_DIST) * 0.35;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(148,130,255,${alpha})`;
          ctx.lineWidth   = 0.8;
          ctx.stroke();
        }
      }
    }
    /* dots */
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(180,165,255,0.55)';
      ctx.fill();
    });
  }

  function updateParticles() {
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0)  { p.x = 0;  p.vx *= -1; }
      if (p.x > W)  { p.x = W;  p.vx *= -1; }
      if (p.y < 0)  { p.y = 0;  p.vy *= -1; }
      if (p.y > H)  { p.y = H;  p.vy *= -1; }
    });
  }

  function draw(ts) {
    ctx.clearRect(0, 0, W, H);

    /* base */
    ctx.fillStyle = '#050d1a';
    ctx.fillRect(0, 0, W, H);

    /* aurora layer */
    ctx.globalCompositeOperation = 'screen';
    drawBlobs(ts);
    ctx.globalCompositeOperation = 'source-over';

    /* subtle vignette */
    const vig = ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.9);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,10,0.55)');
    ctx.fillStyle = vig;
    ctx.fillRect(0,0,W,H);

    /* particle network on top */
    drawParticles();
    updateParticles();

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
})();
</script>

</body>
</html>
